version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      target: development
    container_name: fastapi_app
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: